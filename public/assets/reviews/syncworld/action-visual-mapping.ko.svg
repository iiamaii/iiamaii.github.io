<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1040"
 viewBox="0 0 900 1040" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">명령은 같아도, 화면은 다르다</title><desc id="desc">카메라 방향이 반대인 두 시점의 설명용 예. 행동과 영상의 쌍 · 6개 운동 자유도의 12방향</desc>
<defs>
 <marker id="blue" markerWidth="28" markerHeight="28" refX="24" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L24 12 L2 22" fill="none" stroke="#4659be" stroke-width="3"/></marker>
 <marker id="teal" markerWidth="28" markerHeight="28" refX="24" refY="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L24 12 L2 22" fill="none" stroke="#137d70" stroke-width="3"/></marker>
</defs>
<rect width="900" height="1040" fill="#f8fafc" rx="26"/>
<g font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="45" y="48" font-size="21" fill="#4659be" font-weight="700" text-anchor="start">01 / ACTION–VISUAL MAPPING</text>
<text x="45" y="104" font-size="46" fill="#222b32" font-weight="700" text-anchor="start">명령은 같아도, 화면은 다르다</text>
<text x="45" y="148" font-size="27" fill="#5e6c74" font-weight="400" text-anchor="start">카메라 방향이 반대인 두 시점의 설명용 예</text>
<rect x="45" y="185" width="810" height="135" rx="22" fill="#ffffff" stroke="#d8dfe6" stroke-width="2"/>
<text x="80" y="231" font-size="34" fill="#5e6c74" font-weight="400" text-anchor="start">같은 물리 이동 명령</text>
<text x="88" y="291" font-size="44" fill="#4659be" font-weight="700" text-anchor="start">+x</text>
<path d="M 200 268 L 670 268" fill="none" stroke="#4659be" stroke-width="7" stroke-linecap="round" marker-end="url(#blue)"/>
<rect x="715" y="243" width="50" height="50" rx="8" fill="#dce5fb" stroke="#4659be" stroke-width="2"/>
<text x="235" y="376" font-size="38" fill="#222b32" font-weight="700" text-anchor="middle">시점 A</text>
<rect x="45" y="400" width="380" height="245" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M 80 540 H 390" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="130" cy="520" r="26" fill="#4659be" opacity="0.2"/>
<path d="M 130 495 L 350 495" fill="none" stroke="#4659be" stroke-width="7" stroke-linecap="round" marker-end="url(#blue)"/>
<circle cx="350" cy="520" r="26" fill="#4659be" opacity="1"/>
<text x="235" y="610" font-size="34" fill="#4659be" font-weight="600" text-anchor="middle">화면에서 오른쪽으로</text>
<text x="665" y="376" font-size="38" fill="#222b32" font-weight="700" text-anchor="middle">시점 B</text>
<rect x="475" y="400" width="380" height="245" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<path d="M 510 540 H 820" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="780" cy="520" r="26" fill="#137d70" opacity="0.2"/>
<path d="M 780 495 L 560 495" fill="none" stroke="#137d70" stroke-width="7" stroke-linecap="round" marker-end="url(#teal)"/>
<circle cx="560" cy="520" r="26" fill="#137d70" opacity="1"/>
<text x="665" y="610" font-size="34" fill="#137d70" font-weight="600" text-anchor="middle">화면에서 왼쪽으로</text>
<rect x="45" y="700" width="810" height="260" rx="22" fill="#edf2ff" stroke="#c9d5f1" stroke-width="2"/>
<text x="80" y="748" font-size="38" fill="#4659be" font-weight="700" text-anchor="start">보정 문맥이 대응을 알려준다</text>
<text x="80" y="790" font-size="28" fill="#5e6c74" font-weight="400" text-anchor="start">행동과 영상의 쌍 · 6개 운동 자유도의 12방향</text>
<rect x="78" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="135.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+x</text>
<rect x="204" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="261.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−x</text>
<rect x="330" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="387.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+y</text>
<rect x="456" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="513.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−y</text>
<rect x="582" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="639.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+z</text>
<rect x="708" y="813" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="765.5" y="847" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−z</text>
<rect x="78" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="135.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+yaw</text>
<rect x="204" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="261.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−yaw</text>
<rect x="330" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="387.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+pitch</text>
<rect x="456" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="513.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−pitch</text>
<rect x="582" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="639.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">+roll</text>
<rect x="708" y="875" width="115" height="50" rx="12" fill="#ffffff" stroke="#c9d5f1" stroke-width="2"/>
<text x="765.5" y="909" font-size="32" fill="#4659be" font-weight="600" text-anchor="middle">−roll</text>
<text x="450" y="1009" font-size="24" fill="#5e6c74" font-weight="400" text-anchor="middle">설명용 개념도 · 관측값이나 실험 결과가 아님</text></g>
</svg>
